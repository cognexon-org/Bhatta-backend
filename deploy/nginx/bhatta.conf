server {
    listen 80;
    server_name bhatta.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bhatta.example.com;

    # Configure certbot/ACME paths for your domain.
    ssl_certificate     /etc/letsencrypt/live/bhatta.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhatta.example.com/privkey.pem;

    root /var/www/bhatta-admin;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
